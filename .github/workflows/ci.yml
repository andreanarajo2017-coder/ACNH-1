name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API — lint, typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    # Integration tests (test/helpers/app.ts) run against a real Postgres
    # instead of Testcontainers — see docs/decisions.md ADR-006.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: copiloto
          POSTGRES_PASSWORD: copiloto
          POSTGRES_DB: copiloto
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U copiloto -d copiloto"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://copiloto:copiloto@localhost:5432/copiloto
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format

      - name: Typecheck
        run: npm run typecheck

      - name: Enable citext extension
        run: PGPASSWORD=copiloto psql -h localhost -U copiloto -d copiloto -c "CREATE EXTENSION IF NOT EXISTS citext;"

      - name: Migrate database
        run: npm run db:migrate

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Generate OpenAPI spec
        run: npm run openapi:generate

  mobile:
    name: Mobile — analyze, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
