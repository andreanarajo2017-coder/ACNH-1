name: copiloto
description: Copiloto Personal de Carga Mental — cliente móvil (Flutter).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3

  # D-01: Riverpod, go_router, drift (SQLite) para offline, dio para HTTP
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.7.0
  drift: ^2.20.2
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  flutter_secure_storage: ^9.2.2
  permission_handler: ^11.3.1
  table_calendar: ^3.1.2

  # D-06: FCM (Android) / APNs vía FCM (iOS) — M6. Sin proyecto de Firebase
  # configurado todavía (docs/decisions.md); PushService degrada a no-op si
  # la inicialización falla, en vez de romper la app.
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  drift_dev: ^2.20.2

flutter:
  uses-material-design: true
  generate: true
